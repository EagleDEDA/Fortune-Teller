<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解答之書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  (function(d) {
    var config = {
      kitId: 'rin8wtc',
      scriptTimeout: 3000,
      async: true
    },
    h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
  })(document);

<style>
  :root {
    --plum: #241639;      /* base background */
    --paper: #FBF7F0;     /* card / panel */
    --amber: #FFB627;     /* orb + primary accent */
    --coral: #FF5C7A;     /* answer highlight */
    --ink: #1A1023;       /* near-black text on light */
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    font-family: 'Noto Sans TC', 'Inter', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: var(--plum);
    color: var(--paper);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-family: 'ads-route7', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
    font-size: clamp(2rem, 8vw, 2.8rem);
    font-weight: 400;
    letter-spacing: -0.5px;
    margin: 0 0 10px;
    color: var(--paper);
  }

  .subtitle {
    font-size: 1rem;
    line-height: 1.5;
    color: var(--paper);
    opacity: 0.75;
    margin: 0 0 48px;
    max-width: 320px;
  }

  /* The orb — flat solid circle, thick outline, no shadow/gradient */
  .orb-wrap {
    width: 200px;
    height: 200px;
    margin: 0 auto 22px;
  }

  .orb {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--amber);
    border: 6px solid var(--paper);
    cursor: pointer;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    font-weight: 500;
    font-size: 1.1rem;
    letter-spacing: 1px;
    color: var(--ink);
    text-transform: uppercase;
    transition: background-color 0.15s ease, transform 0.15s ease;
  }

  .orb:hover { background: #ffc75a; }
  .orb:active { transform: scale(0.95); }

  .orb.shaking {
    background: var(--coral);
    animation: shake 0.4s linear infinite;
  }

  .orb.disabled { pointer-events: none; }

  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-6deg); }
    75% { transform: rotate(6deg); }
  }

  .orb-hint {
    margin-top: 4px;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: var(--paper);
    opacity: 0.6;
    min-height: 1.2em;
  }

  /* Answer card — flat block, hard edges, solid offset border (no blur/shadow) */
  .answer-card {
    background: var(--paper);
    border: 4px solid var(--ink);
    padding: 32px 26px;
    max-width: 420px;
    width: 100%;
    text-align: left;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    margin: 40px 0 24px;
  }

  .answer-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .answer-label {
    display: inline-block;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 1px;
    color: var(--ink);
    background: var(--coral);
    padding: 3px 10px;
    margin-bottom: 16px;
  }

  .answer-text {
    font-family: 'wenwriting-proportional', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
    font-size: clamp(1.15rem, 4vw, 1.4rem);
    font-weight: 400;
    line-height: 1.4;
    color: var(--ink);
  }

  .again-btn {
    background: var(--paper);
    border: 3px solid var(--paper);
    color: var(--plum);
    padding: 12px 30px;
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    font-weight: 500;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
    opacity: 0;
    transform: translateY(6px);
  }

  .again-btn.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .again-btn:hover {
    background: var(--amber);
    border-color: var(--amber);
    color: var(--ink);
  }

  footer {
    margin-top: 56px;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--paper);
    opacity: 0.45;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>解答之書</h1>
  <p class="subtitle">默念你的問題三遍後，接著點我。</p>

  <div class="orb-wrap">
    <button class="orb" id="orb" aria-label="點我以揭曉答案">點我</button>
  </div>
  <div class="orb-hint" id="hint">一次只問一個問題</div>

  <div id="answerArea"></div>
</div>

<footer>相信你的第一直覺</footer>

<script>
  const answers = [
    "是的，毫無疑問。",
    "不。放下它吧。",
    "還沒到時候。",
    "答案早已在你心中。",
    "等心靜下來後再問一次。",
    "是的，但要有耐心。",
    "這不是正確的路。",
    "相信你的感覺，而非你的恐懼。",
    "再等一個更清楚的徵兆。",
    "是的，勇敢跨出去吧。",
    "答案就藏在你一直逃避的事情裡。",
    "不，其實你早就知道了。",
    "這取決於你願意拿出多少勇氣。",
    "再仔細看看，真相很微妙。",
    "是的，只要你放下疑慮。",
    "這次不行。",
    "宇宙說：靜下來。",
    "你其實已經有答案了，只是還沒承認。",
    "跟隨那個不再害怕的自己。",
    "時間會讓一切自然解決。",
    "是的，但不會是你預期的方式。",
    "問問你信任的人吧，這題不只靠神諭球。",
    "不，更好的事情正在路上。",
    "答案藏在你最近的一個夢裡。",
    "是的，現在就去，別再等了。",
    "不確定，再多花點時間思考這個問題。",
    "你所尋找的，也正在尋找你。",
    "不，但這個教訓值得。",
    "是的，跡象其實一直都在。",
    "這次讓沉默來回答。",
    "你想太多了。答案很簡單：是。",
    "你想太多了。答案很簡單：不。",
    "現在是等待的季節，不是行動的時候。",
    "換個問法，答案也會不同。",
    "是的，但前提是你全心全意。",
    "放下想立刻知道答案的執念。",
    "不，離開這條路吧。",
    "星星還沒決定。明天再問一次。",
    "是的，你的直覺早就告訴你了。",
    "不是這條路，另一條正在展開。",
    "真相是：你害怕答案勝過害怕問題本身。",
    "是的，用盡全力去做。",
    "不，把精力留給自己。",
    "比你想的還要接近了。是的。",
    "停下來，深呼吸，現在先別決定。",
    "答案是平靜而堅定的：是。",
    "答案是平靜而堅定的：不。",
    "覺得沉重的不是你的答案，覺得輕盈的才是。",
    "是的，門已經打開了，走進去吧。",
    "命只有一條。",
    "有捨才有得。",
    "不要甩鍋。",
    "不要怕麻煩。",
    "說者無心，聽者有意。",
    "不用特別設計。",
    "不要浪費國家資源。",
    "忌妒使你醜陋。",
    "當無法並肩同行，那就背道而馳吧～",
    "善良有時候需要帶一點鋒芒。",
    "離開情緒寄生獸。",
    "後面就會輕鬆一點了。",
    "失智又耳鳴。"
  ];

  let bag = [];
  let lastIndex = -1;

  function refillBag() {
    // Fisher–Yates shuffle of all indices
    bag = answers.map((_, i) => i);
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
    // avoid the new bag starting with the same answer that just ended the last bag
    if (lastIndex !== -1 && bag[0] === lastIndex && bag.length > 1) {
      [bag[0], bag[1]] = [bag[1], bag[0]];
    }
  }

  function pickAnswer() {
    if (bag.length === 0) refillBag();
    const idx = bag.pop();
    lastIndex = idx;
    return answers[idx];
  }

  const orb = document.getElementById('orb');
  const hint = document.getElementById('hint');
  const answerArea = document.getElementById('answerArea');

  let busy = false;

  function reveal() {
    if (busy) return;
    busy = true;
    orb.classList.add('shaking');
    orb.classList.add('disabled');
    orb.textContent = '···';
    hint.textContent = '傾聽中…';

    // clear any previous answer card
    answerArea.innerHTML = '';

    setTimeout(() => {
      orb.classList.remove('shaking');
      orb.classList.remove('disabled');
      orb.textContent = '點我';
      hint.textContent = '一次只問一個問題';
      busy = false;

      const answer = pickAnswer();

      const card = document.createElement('div');
      card.className = 'answer-card';
      card.innerHTML = `
        <div class="answer-label">你的答案</div>
        <div class="answer-text">${answer}</div>
      `;
      answerArea.appendChild(card);
      requestAnimationFrame(() => card.classList.add('visible'));

      const btn = document.createElement('button');
      btn.className = 'again-btn';
      btn.textContent = '再問一次';
      btn.onclick = () => {
        card.remove();
        btn.remove();
        hint.textContent = '一次只問一個問題';
      };
      answerArea.appendChild(btn);
      requestAnimationFrame(() => btn.classList.add('visible'));
    }, 1400);
  }

  orb.addEventListener('click', reveal);
</script>

</body>
</html>
